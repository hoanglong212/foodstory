<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1260" viewBox="0 0 2000 1260" role="img" aria-labelledby="title desc"><title id="title">Stage 3 sequence diagram</title><desc id="desc">Sequence from FoodMapView through the composable, asynchronous backend job, adapter, and reactive map UI with cancellation and stale-response paths.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2b211b" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b84b16"/></marker></defs><rect width="2000" height="1260" fill="#fffaf5"/><rect x="0" y="0" width="2000" height="118" fill="#34302d"/><rect x="0" y="112" width="2000" height="6" fill="#e8752b"/><text x="64" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Stage 3 sequence</text><text x="64" y="88" fill="#e8ddd5" font-family="Arial, sans-serif" font-size="17">Long-running job coordination and safe Leaflet synchronisation</text><rect x="28" y="158" width="184" height="58" rx="14" fill="#ffffff" stroke="#d9cec4" stroke-width="2" /><text x="120" y="194" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">FoodMapView</text><line x1="120" y1="216" x2="120" y2="1160" stroke="#b9aea5" stroke-width="2" stroke-dasharray="8 7" /><rect x="313" y="158" width="184" height="58" rx="14" fill="#fff0e5" stroke="#e8752b" stroke-width="2" /><text x="405" y="194" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">useVisionAuto</text><line x1="405" y1="216" x2="405" y2="1160" stroke="#b9aea5" stroke-width="2" stroke-dasharray="8 7" /><rect x="598" y="158" width="184" height="58" rx="14" fill="#ffffff" stroke="#d9cec4" stroke-width="2" /><text x="690" y="194" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Job API</text><line x1="690" y1="216" x2="690" y2="1160" stroke="#b9aea5" stroke-width="2" stroke-dasharray="8 7" /><rect x="883" y="158" width="184" height="58" rx="14" fill="#ffffff" stroke="#d9cec4" stroke-width="2" /><text x="975" y="194" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Coordinator</text><line x1="975" y1="216" x2="975" y2="1160" stroke="#b9aea5" stroke-width="2" stroke-dasharray="8 7" /><rect x="1168" y="158" width="184" height="58" rx="14" fill="#ffffff" stroke="#d9cec4" stroke-width="2" /><text x="1260" y="194" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Worker</text><line x1="1260" y1="216" x2="1260" y2="1160" stroke="#b9aea5" stroke-width="2" stroke-dasharray="8 7" /><rect x="1453" y="158" width="184" height="58" rx="14" fill="#ffffff" stroke="#d9cec4" stroke-width="2" /><text x="1545" y="194" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">UI adapter</text><line x1="1545" y1="216" x2="1545" y2="1160" stroke="#b9aea5" stroke-width="2" stroke-dasharray="8 7" /><rect x="1738" y="158" width="184" height="58" rx="14" fill="#ffffff" stroke="#d9cec4" stroke-width="2" /><text x="1830" y="194" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Reactive map UI</text><line x1="1830" y1="216" x2="1830" y2="1160" stroke="#b9aea5" stroke-width="2" stroke-dasharray="8 7" /><line x1="120" y1="265" x2="395" y2="265" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="262.5" y="253" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="262.5" dy="0">submit(url)</tspan></text><line x1="405" y1="330" x2="680" y2="330" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="547.5" y="318" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="547.5" dy="0">POST /jobs with AbortSignal</tspan></text><line x1="690" y1="395" x2="965" y2="395" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="832.5" y="383" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="832.5" dy="0">submit canonical source; return jobId</tspan></text><line x1="975" y1="460" x2="1250" y2="460" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1117.5" y="448" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1117.5" dy="0">start worker with deadline + heartbeat</tspan></text><line x1="1260" y1="525" x2="985" y2="525" stroke="#3f6f8f" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1117.5" y="513" fill="#3f6f8f" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1117.5" dy="0">stage: metadata / deep analysis /</tspan><tspan x="1117.5" dy="18">resolving</tspan></text><line x1="405" y1="590" x2="680" y2="590" stroke="#b84b16" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="547.5" y="578" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="547.5" dy="0">GET /jobs/:id every 1.5 s</tspan></text><line x1="690" y1="655" x2="415" y2="655" stroke="#3f6f8f" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="547.5" y="643" fill="#3f6f8f" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="547.5" dy="0">bounded stage/status response</tspan></text><line x1="1260" y1="720" x2="985" y2="720" stroke="#2f7d62" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1117.5" y="708" fill="#2f7d62" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1117.5" dy="0">sanitised terminal result</tspan></text><line x1="975" y1="785" x2="700" y2="785" stroke="#2f7d62" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="832.5" y="773" fill="#2f7d62" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="832.5" dy="0">completed / not_found / failed / cancelled</tspan><tspan x="832.5" dy="18">/ timed_out</tspan></text><line x1="690" y1="850" x2="415" y2="850" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="547.5" y="838" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="547.5" dy="0">public result</tspan></text><line x1="405" y1="915" x2="1535" y2="915" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="975" y="903" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="975" dy="0">adaptVisionAutoResponse(result)</tspan></text><line x1="1545" y1="970" x2="415" y2="970" stroke="#2f7d62" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="975" y="958" fill="#2f7d62" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="975" dy="0">safe matched / review / not_found state</tspan></text><line x1="405" y1="1025" x2="130" y2="1025" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="262.5" y="1013" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="262.5" dy="0">reactive refs update</tspan></text><line x1="120" y1="1080" x2="1820" y2="1080" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="975" y="1068" fill="#b84b16" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="975" dy="0">focus existing marker or finite resolver</tspan><tspan x="975" dy="18">coordinates</tspan></text><rect x="70" y="1125" width="1860" height="86" rx="16" fill="#34302d" stroke="#34302d" stroke-width="2" /><text x="105" y="1158" fill="#e8752b" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">ALTERNATES</text><text x="105" y="1185" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="105" dy="0">Cancel/unmount: invalidate run -&gt; AbortController -&gt; clear timers -&gt; DELETE backend job. Stale response: run guard rejects mutation; a late-created stale job is</tspan><tspan x="105" dy="20">cancelled.</tspan></text></svg>