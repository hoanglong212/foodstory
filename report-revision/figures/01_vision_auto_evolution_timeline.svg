<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">Vision Auto evolution timeline</title><desc id="desc">Five stages from single-image OCR to dish-first discovery with problem, change, outcome, and limitation.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2b211b" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b84b16"/></marker></defs><rect width="1800" height="1080" fill="#fffaf5"/><rect x="0" y="0" width="1800" height="118" fill="#34302d"/><rect x="0" y="112" width="1800" height="6" fill="#e8752b"/><text x="64" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Vision Auto evolution</text><text x="64" y="88" fill="#e8ddd5" font-family="Arial, sans-serif" font-size="17">From image OCR to safe, dish-first food discovery</text><line x1="140" y1="205" x2="1660" y2="205" stroke="#b84b16" stroke-width="5"  marker-end="url(#arrow)"/><circle cx="206" cy="205" r="28" fill="#e8752b" stroke="#ffffff" stroke-width="6"/><text x="206" y="213" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text><rect x="52" y="258" width="308" height="690" rx="20" fill="#ffffff" stroke="#d9cec4" stroke-width="2" filter="url(#shadow)"/><rect x="74" y="282" width="90" height="30" rx="15" fill="#fff0e5" stroke="#fff0e5" stroke-width="2" /><text x="119" y="303" fill="#b84b16" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">STAGE 1</text><text x="74" y="344" fill="#262321" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="74" dy="0">Single-image OCR</tspan></text><rect x="72" y="418" width="268" height="116" rx="12" fill="#f8ebe9" stroke="#f8ebe9" stroke-width="2" /><text x="86" y="445" fill="#a4483d" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">PROBLEM</text><text x="86" y="470" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="86" dy="0">One still misses transient</tspan><tspan x="86" dy="19">video overlays.</tspan></text><rect x="72" y="550" width="268" height="116" rx="12" fill="#eaf2f7" stroke="#eaf2f7" stroke-width="2" /><text x="86" y="577" fill="#3f6f8f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">CHANGE</text><text x="86" y="602" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="86" dy="0">Accept a bounded image and</tspan><tspan x="86" dy="19">extract visible text.</tspan></text><rect x="72" y="682" width="268" height="116" rx="12" fill="#e9f5f0" stroke="#e9f5f0" stroke-width="2" /><text x="86" y="709" fill="#2f7d62" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">OUTCOME</text><text x="86" y="734" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="86" dy="0">Established the first evidence</tspan><tspan x="86" dy="19">path.</tspan></text><rect x="72" y="814" width="268" height="116" rx="12" fill="#f4f0ec" stroke="#f4f0ec" stroke-width="2" /><text x="86" y="841" fill="#71675f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">LIMITATION</text><text x="86" y="866" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="86" dy="0">No temporal coverage; OCR text</tspan><tspan x="86" dy="19">is not a place.</tspan></text><circle cx="556" cy="205" r="28" fill="#e8752b" stroke="#ffffff" stroke-width="6"/><text x="556" y="213" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text><rect x="402" y="258" width="308" height="690" rx="20" fill="#ffffff" stroke="#d9cec4" stroke-width="2" filter="url(#shadow)"/><rect x="424" y="282" width="90" height="30" rx="15" fill="#fff0e5" stroke="#fff0e5" stroke-width="2" /><text x="469" y="303" fill="#b84b16" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">STAGE 2</text><text x="424" y="344" fill="#262321" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="424" dy="0">Early video sampling</tspan></text><rect x="422" y="418" width="268" height="116" rx="12" fill="#f8ebe9" stroke="#f8ebe9" stroke-width="2" /><text x="436" y="445" fill="#a4483d" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">PROBLEM</text><text x="436" y="470" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="436" dy="0">Useful text may appear for</tspan><tspan x="436" dy="19">only a few frames.</tspan></text><rect x="422" y="550" width="268" height="116" rx="12" fill="#eaf2f7" stroke="#eaf2f7" stroke-width="2" /><text x="436" y="577" fill="#3f6f8f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">CHANGE</text><text x="436" y="602" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="436" dy="0">Sample selected frames from</tspan><tspan x="436" dy="19">public video.</tspan></text><rect x="422" y="682" width="268" height="116" rx="12" fill="#e9f5f0" stroke="#e9f5f0" stroke-width="2" /><text x="436" y="709" fill="#2f7d62" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">OUTCOME</text><text x="436" y="734" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="436" dy="0">Expanded evidence beyond one</tspan><tspan x="436" dy="19">still.</tspan></text><rect x="422" y="814" width="268" height="116" rx="12" fill="#f4f0ec" stroke="#f4f0ec" stroke-width="2" /><text x="436" y="841" fill="#71675f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">LIMITATION</text><text x="436" y="866" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="436" dy="0">Frame selection and latency</tspan><tspan x="436" dy="19">remain coupled.</tspan></text><circle cx="906" cy="205" r="28" fill="#e8752b" stroke="#ffffff" stroke-width="6"/><text x="906" y="213" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text><rect x="752" y="258" width="308" height="690" rx="20" fill="#ffffff" stroke="#d9cec4" stroke-width="2" filter="url(#shadow)"/><rect x="774" y="282" width="90" height="30" rx="15" fill="#fff0e5" stroke="#fff0e5" stroke-width="2" /><text x="819" y="303" fill="#b84b16" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">STAGE 3</text><text x="774" y="344" fill="#262321" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="774" dy="0">Track 1 / Track 2</tspan></text><rect x="772" y="418" width="268" height="116" rx="12" fill="#f8ebe9" stroke="#f8ebe9" stroke-width="2" /><text x="786" y="445" fill="#a4483d" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">PROBLEM</text><text x="786" y="470" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="786" dy="0">Strong metadata and uncertain</tspan><tspan x="786" dy="19">media need different cost.</tspan></text><rect x="772" y="550" width="268" height="116" rx="12" fill="#eaf2f7" stroke="#eaf2f7" stroke-width="2" /><text x="786" y="577" fill="#3f6f8f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">CHANGE</text><text x="786" y="602" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="786" dy="0">Route deterministic cases</tspan><tspan x="786" dy="19">fast; escalate uncertain</tspan><tspan x="786" dy="19">cases.</tspan></text><rect x="772" y="682" width="268" height="116" rx="12" fill="#e9f5f0" stroke="#e9f5f0" stroke-width="2" /><text x="786" y="709" fill="#2f7d62" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">OUTCOME</text><text x="786" y="734" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="786" dy="0">Made safety and compute paths</tspan><tspan x="786" dy="19">explicit.</tspan></text><rect x="772" y="814" width="268" height="116" rx="12" fill="#f4f0ec" stroke="#f4f0ec" stroke-width="2" /><text x="786" y="841" fill="#71675f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">LIMITATION</text><text x="786" y="866" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="786" dy="0">Routing is not full-pipeline</tspan><tspan x="786" dy="19">accuracy.</tspan></text><circle cx="1256" cy="205" r="28" fill="#e8752b" stroke="#ffffff" stroke-width="6"/><text x="1256" y="213" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">4</text><rect x="1102" y="258" width="308" height="690" rx="20" fill="#ffffff" stroke="#d9cec4" stroke-width="2" filter="url(#shadow)"/><rect x="1124" y="282" width="90" height="30" rx="15" fill="#fff0e5" stroke="#fff0e5" stroke-width="2" /><text x="1169" y="303" fill="#b84b16" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">STAGE 4</text><text x="1124" y="344" fill="#262321" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="1124" dy="0">Candidate-first</tspan></text><rect x="1122" y="418" width="268" height="116" rx="12" fill="#f8ebe9" stroke="#f8ebe9" stroke-width="2" /><text x="1136" y="445" fill="#a4483d" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">PROBLEM</text><text x="1136" y="470" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1136" dy="0">Plausible OCR can be promoted</tspan><tspan x="1136" dy="19">too aggressively.</tspan></text><rect x="1122" y="550" width="268" height="116" rx="12" fill="#eaf2f7" stroke="#eaf2f7" stroke-width="2" /><text x="1136" y="577" fill="#3f6f8f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">CHANGE</text><text x="1136" y="602" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1136" dy="0">Publish review-only candidates</tspan><tspan x="1136" dy="19">with no map coordinates.</tspan></text><rect x="1122" y="682" width="268" height="116" rx="12" fill="#e9f5f0" stroke="#e9f5f0" stroke-width="2" /><text x="1136" y="709" fill="#2f7d62" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">OUTCOME</text><text x="1136" y="734" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1136" dy="0">Preserved evidence without</tspan><tspan x="1136" dy="19">inventing a location.</tspan></text><rect x="1122" y="814" width="268" height="116" rx="12" fill="#f4f0ec" stroke="#f4f0ec" stroke-width="2" /><text x="1136" y="841" fill="#71675f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">LIMITATION</text><text x="1136" y="866" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1136" dy="0">Human confirmation is still</tspan><tspan x="1136" dy="19">required.</tspan></text><circle cx="1606" cy="205" r="28" fill="#e8752b" stroke="#ffffff" stroke-width="6"/><text x="1606" y="213" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">5</text><rect x="1452" y="258" width="308" height="690" rx="20" fill="#ffffff" stroke="#d9cec4" stroke-width="2" filter="url(#shadow)"/><rect x="1474" y="282" width="90" height="30" rx="15" fill="#fff0e5" stroke="#fff0e5" stroke-width="2" /><text x="1519" y="303" fill="#b84b16" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">STAGE 5</text><text x="1474" y="344" fill="#262321" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="1474" dy="0">Dish-first</tspan></text><rect x="1472" y="418" width="268" height="116" rx="12" fill="#f8ebe9" stroke="#f8ebe9" stroke-width="2" /><text x="1486" y="445" fill="#a4483d" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">PROBLEM</text><text x="1486" y="470" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1486" dy="0">Many videos identify food</tspan><tspan x="1486" dy="19">better than filming location.</tspan></text><rect x="1472" y="550" width="268" height="116" rx="12" fill="#eaf2f7" stroke="#eaf2f7" stroke-width="2" /><text x="1486" y="577" fill="#3f6f8f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">CHANGE</text><text x="1486" y="602" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1486" dy="0">Identify dishes, then search</tspan><tspan x="1486" dy="19">places serving them.</tspan></text><rect x="1472" y="682" width="268" height="116" rx="12" fill="#e9f5f0" stroke="#e9f5f0" stroke-width="2" /><text x="1486" y="709" fill="#2f7d62" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">OUTCOME</text><text x="1486" y="734" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1486" dy="0">Creates useful discovery</tspan><tspan x="1486" dy="19">without weakening place</tspan><tspan x="1486" dy="19">safety.</tspan></text><rect x="1472" y="814" width="268" height="116" rx="12" fill="#f4f0ec" stroke="#f4f0ec" stroke-width="2" /><text x="1486" y="841" fill="#71675f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start">LIMITATION</text><text x="1486" y="866" fill="#262321" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1486" dy="0">Serving places are not filming</tspan><tspan x="1486" dy="19">locations.</tspan></text><text x="900" y="1017" fill="#b84b16" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Safety boundary: evidence can remain useful without becoming a resolved map location.</text></svg>