<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">useVisionAuto state machine</title><desc id="desc">Reactive state machine from idle through queued and analysis stages to completed, review, not found, timeout, or cancelled.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2b211b" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b84b16"/></marker></defs><rect width="1800" height="1120" fill="#fffaf5"/><rect x="0" y="0" width="1800" height="118" fill="#34302d"/><rect x="0" y="112" width="1800" height="6" fill="#e8752b"/><text x="64" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">useVisionAuto state machine</text><text x="64" y="88" fill="#e8ddd5" font-family="Arial, sans-serif" font-size="17">Vue-owned reactive lifecycle; backend stages are reduced to safe UI states</text><rect x="70" y="205" width="210" height="74" rx="18" fill="#fff0e5" stroke="#e8752b" stroke-width="2" filter="url(#shadow)"/><text x="175" y="251" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Idle</text><rect x="340" y="205" width="210" height="74" rx="18" fill="#ffffff" stroke="#e8752b" stroke-width="2" filter="url(#shadow)"/><text x="445" y="251" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Queued / starting</text><rect x="610" y="205" width="210" height="74" rx="18" fill="#ffffff" stroke="#e8752b" stroke-width="2" filter="url(#shadow)"/><text x="715" y="251" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Fast analysis</text><rect x="880" y="205" width="210" height="74" rx="18" fill="#ffffff" stroke="#e8752b" stroke-width="2" filter="url(#shadow)"/><text x="985" y="251" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Deep analysis</text><rect x="1150" y="205" width="210" height="74" rx="18" fill="#ffffff" stroke="#e8752b" stroke-width="2" filter="url(#shadow)"/><text x="1255" y="251" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Resolving</text><line x1="280" y1="242" x2="330" y2="242" stroke="#b84b16" stroke-width="3"  marker-end="url(#arrow)"/><line x1="550" y1="242" x2="600" y2="242" stroke="#b84b16" stroke-width="3"  marker-end="url(#arrow)"/><line x1="820" y1="242" x2="870" y2="242" stroke="#b84b16" stroke-width="3"  marker-end="url(#arrow)"/><line x1="1090" y1="242" x2="1140" y2="242" stroke="#b84b16" stroke-width="3"  marker-end="url(#arrow)"/><text x="445" y="178" fill="#71675f" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">create job + poll</text><rect x="90" y="490" width="220" height="74" rx="18" fill="#e9f5f0" stroke="#2f7d62" stroke-width="2" filter="url(#shadow)"/><text x="200" y="536" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Completed</text><text x="200" y="594" fill="#71675f" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="200" dy="0">Resolver-backed place or</tspan><tspan x="200" dy="20">dish places</tspan></text><line x1="1255" y1="279" x2="200" y2="480" stroke="#2f7d62" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="360" y="490" width="220" height="74" rx="18" fill="#eaf2f7" stroke="#3f6f8f" stroke-width="2" filter="url(#shadow)"/><text x="470" y="536" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Review</text><text x="470" y="594" fill="#71675f" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="470" dy="0">Candidate remains</tspan><tspan x="470" dy="20">review-only</tspan></text><line x1="1255" y1="279" x2="470" y2="480" stroke="#3f6f8f" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="630" y="490" width="220" height="74" rx="18" fill="#f4f0ec" stroke="#71675f" stroke-width="2" filter="url(#shadow)"/><text x="740" y="536" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Not found</text><text x="740" y="594" fill="#71675f" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="740" dy="0">Intentional safe terminal</tspan><tspan x="740" dy="20">outcome</tspan></text><line x1="1255" y1="279" x2="740" y2="480" stroke="#71675f" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="900" y="490" width="220" height="74" rx="18" fill="#f8ebe9" stroke="#a4483d" stroke-width="2" filter="url(#shadow)"/><text x="1010" y="536" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Timeout</text><text x="1010" y="594" fill="#71675f" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1010" dy="0">Adapted to safe not-found</tspan><tspan x="1010" dy="20">reason</tspan></text><line x1="1255" y1="279" x2="1010" y2="480" stroke="#a4483d" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="1170" y="490" width="220" height="74" rx="18" fill="#fff0e5" stroke="#b84b16" stroke-width="2" filter="url(#shadow)"/><text x="1280" y="536" fill="#262321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Cancelled</text><text x="1280" y="594" fill="#71675f" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1280" dy="0">Run invalidated; UI returns</tspan><tspan x="1280" dy="20">idle</tspan></text><line x1="1255" y1="279" x2="1280" y2="480" stroke="#b84b16" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="120" y="755" width="1560" height="190" rx="20" fill="#34302d" stroke="#34302d" stroke-width="2" /><text x="160" y="800" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Lifecycle controls</text><rect x="160" y="830" width="100" height="30" rx="15" fill="#4a4541" stroke="#4a4541" stroke-width="2" /><text x="210" y="851" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Cancel</text><text x="160" y="884" fill="#eee4dc" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="160" dy="0">invalidate run -&gt; abort HTTP -&gt; clear</tspan><tspan x="160" dy="19">poll + elapsed timers -&gt; DELETE backend</tspan><tspan x="160" dy="19">job</tspan></text><rect x="535" y="830" width="100" height="30" rx="15" fill="#4a4541" stroke="#4a4541" stroke-width="2" /><text x="585" y="851" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Retry</text><text x="535" y="884" fill="#eee4dc" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="535" dy="0">start a fresh controller and</tspan><tspan x="535" dy="19">monotonically increasing run identity</tspan></text><rect x="910" y="830" width="100" height="30" rx="15" fill="#4a4541" stroke="#4a4541" stroke-width="2" /><text x="960" y="851" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reset</text><text x="910" y="884" fill="#eee4dc" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="910" dy="0">cancel, clear URL/result/errors, return</tspan><tspan x="910" dy="19">input mode and elapsed time to defaults</tspan></text><rect x="1285" y="830" width="100" height="30" rx="15" fill="#4a4541" stroke="#4a4541" stroke-width="2" /><text x="1335" y="851" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Unmount</text><text x="1285" y="884" fill="#eee4dc" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1285" dy="0">onBeforeUnmount(dispose); FoodMapView</tspan><tspan x="1285" dy="19">separately tears down Leaflet</tspan></text><line x1="1280" y1="564" x2="1280" y2="742" stroke="#b84b16" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="1010" y1="564" x2="1010" y2="742" stroke="#b84b16" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="200" y1="755" x2="170" y2="640" stroke="#b84b16" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="900" y="1026" fill="#b84b16" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">A terminal response mutates Vue state only if its run ID is still current.</text></svg>