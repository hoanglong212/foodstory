 fill="#2f7d62"/><text x="560" y="711" fill="#2f7d62" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">0.048400 ms</text><text x="220" y="774" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">Track 2 V3 - p95</text><rect x="240" y="749" width="1213.5454545454547" height="34" rx="8" fill="#b84b16"/><text x="1465.5454545454547" y="773" fill="#b84b16" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">0.190700 ms</text><text x="220" y="836" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">Final - p95</text><rect x="240" y="811" width="1238.3636363636363" height="34" rx="8" fill="#2f7d62"/><text x="1490.3636363636363" y="835" fill="#2f7d62" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">0.194600 ms</text><rect x="80" y="972" width="1640" height="82" rx="14" fill="#fff0e5" stroke="#fff0e5" stroke-width="2" /><text x="105" y="1004" fill="#b84b16" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start"><tspan x="105" dy="0">Interpretation: safe-routing non-regression on one deterministic router corpus. This does not measure full video acquisition, OCR/ASR, providers, place or dish accuracy,</tspan><tspan x="105" dy="22">adapter/render time, or end-to-end Vision Auto latency.</tspan></text></svg>