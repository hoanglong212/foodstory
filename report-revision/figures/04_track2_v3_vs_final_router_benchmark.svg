<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">Track 2 V3 versus Final router benchmark</title><desc id="desc">Separate percentage and router-latency panels compare safe routing, false promotion, p50, and p95 on 150 measured case-runs per version.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2b211b" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b84b16"/></marker></defs><rect width="1800" height="1120" fill="#fffaf5"/><rect x="0" y="0" width="1800" height="118" fill="#34302d"/><rect x="0" y="112" width="1800" height="6" fill="#e8752b"/><text x="64" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Track 2 V3 vs Final</text><text x="64" y="88" fill="#e8ddd5" font-family="Arial, sans-serif" font-size="17">Deterministic router-only benchmark - 30 cases x 5 measured repeats per version</text><text x="80" y="170" fill="#262321" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start">A. Safety outcomes (%)</text><line x1="240" y1="205" x2="240" y2="475" stroke="#ded4cc" stroke-width="1"  /><text x="240" y="500" fill="#71675f" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">0</text><line x1="520" y1="205" x2="520" y2="475" stroke="#ded4cc" stroke-width="1"  /><text x="520" y="500" fill="#71675f" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">20</text><line x1="800" y1="205" x2="800" y2="475" stroke="#ded4cc" stroke-width="1"  /><text x="800" y="500" fill="#71675f" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">40</text><line x1="1080" y1="205" x2="1080" y2="475" stroke="#ded4cc" stroke-width="1"  /><text x="1080" y="500" fill="#71675f" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">60</text><line x1="1360" y1="205" x2="1360" y2="475" stroke="#ded4cc" stroke-width="1"  /><text x="1360" y="500" fill="#71675f" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">80</text><line x1="1640" y1="205" x2="1640" y2="475" stroke="#ded4cc" stroke-width="1"  /><text x="1640" y="500" fill="#71675f" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">100</text><text x="220" y="245" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">Track 2 V3 - safe routing</text><rect x="240" y="220" width="1353.38" height="34" rx="8" fill="#e8752b"/><text x="1605.38" y="244" fill="#e8752b" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">96.67%</text><text x="220" y="307" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">Final - safe routing</text><rect x="240" y="282" width="1353.38" height="34" rx="8" fill="#2f7d62"/><text x="1605.38" y="306" fill="#2f7d62" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">96.67%</text><text x="220" y="369" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">Track 2 V3 - false promotion</text><rect x="240" y="344" width="4" height="34" rx="8" fill="#b84b16"/><text x="256" y="368" fill="#b84b16" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">0.00%</text><text x="220" y="431" fill="#262321" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">Final - false promotion</text><rect x="240" y="406" width="4" height="34" rx="8" fill="#2f7d62"/><text x="256" y="430" fill="#2f7d62" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start