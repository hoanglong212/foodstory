services:
  - type: web
    name: foodstory-api-cos30043-hoanglong212
    runtime: node
    plan: free
    region: singapore
    branch: codex/render-deployment
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://foodstory-cos30043-hoanglong212.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_SSL_MODE
        value: required
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: web
    name: foodstory-cos30043-hoanglong212
    runtime: static
    branch: codex/render-deployment
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://foodstory-api-cos30043-hoanglong212.onrender.com/api
      - key: VITE_WS_URL
        value: wss://foodstory-api-cos30043-hoanglong212.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
