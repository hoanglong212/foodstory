services:
  - type: web
    name: foodstory-api-cos30043-hoanglong212
    runtime: node
    plan: free
    region: singapore
    branch: codex/render-deployment
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://foodstory-cos30043-hoanglong212.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_SSL_MODE
        value: required
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: https://foodstory-ai-cos30043-hoanglong212.onrender.com
      - key: AI_SERVICE_API_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: web
    name: foodstory-ai-cos30043-hoanglong212
    runtime: python
    plan: free
    region: singapore
    branch: codex/render-deployment
    rootDir: ai-service
    buildCommand: pip install --no-cache-dir "torch==2.13.0+cpu" --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AI_SERVICE_ENV
        value: production
      - key: AI_SERVICE_REQUIRE_AUTH
        value: "true"
      - key: AI_SERVICE_API_TOKEN
        sync: false
      - key: AI_SERVICE_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: AI_SERVICE_ENABLE_CLIP
        value: "false"
  - type: web
    name: foodstory-cos30043-hoanglong212
    runtime: static
    branch: codex/render-deployment
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://foodstory-api-cos30043-hoanglong212.onrender.com/api
      - key: VITE_WS_URL
        value: wss://foodstory-api-cos30043-hoanglong212.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
